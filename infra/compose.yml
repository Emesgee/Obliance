# Obliance — one Compose stack, one systemd unit on the server (ADR-0007 §2).
#
#   dev:   docker compose -f infra/compose.yml up -d postgres redis
#   full:  docker compose -f infra/compose.yml --profile app up -d --build
#
# Secrets come from infra/.env (git-ignored). `:?` makes Compose REFUSE to start
# without them rather than launch an unauthenticated datastore (bidflow's
# CERT-Bund lesson). Postgres and Redis bind to loopback only; Caddy is the
# only container with a public port.
name: obliance

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: obliance
      # Read by 01-roles.sql on first init (dev defaults; rotate in prod, see infra/README.md)
      CC_MIGRATOR_PASSWORD: ${CC_MIGRATOR_PASSWORD:-obliance_migrator}
      CC_APP_PASSWORD: ${CC_APP_PASSWORD:-obliance_app}
      CC_WORKER_PASSWORD: ${CC_WORKER_PASSWORD:-obliance_worker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Production: mount a LUKS-encrypted Hetzner Volume here (ADR-0007 §2).
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d obliance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}", "--save", "60", "1"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: obliance-api:latest
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: postgresql+psycopg://obliance_app:${CC_APP_PASSWORD:-obliance_app}@postgres:5432/obliance
      MIGRATE_DATABASE_URL: postgresql+psycopg://obliance_migrator:${CC_MIGRATOR_PASSWORD:-obliance_migrator}@postgres:5432/obliance
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["8000"]
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
      args:
        API_IMAGE: obliance-api:latest
    image: obliance-worker:latest
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      # Worker connects as obliance_worker: SELECT on registers, writes only to
      # ai_suggestions/agent_runs once they exist (ADR-0004, gate G-07).
      DATABASE_URL: postgresql+psycopg://obliance_worker:${CC_WORKER_PASSWORD:-obliance_worker}@postgres:5432/obliance
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      api: { condition: service_started }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    restart: unless-stopped

  caddy:
    profiles: ["app"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in infra/.env (e.g. app.example.dk)}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/frontend:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
