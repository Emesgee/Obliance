[project]
name = "obliance-backend"
version = "0.1.0"
description = "Obliance — backend (FastAPI, SQLAlchemy 2, Postgres RLS). See docs/adr/0023."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "redis>=5.0,<6",
    "rq>=2.0,<3",
    # auth (ADR-0024): stateless JWT, argon2 password hashing, rate limiting
    "pyjwt>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "limits>=3.13,<6",
    "email-validator>=2.2,<3",
    # documents (ADR-0005/0006): PDF text + page rendering, multipart uploads
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.12,<1",
    "anthropic>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501"]
"migrations/**" = ["ANN", "E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection IS a call in an argument default — by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "app.core.auth.require",
]

[tool.mypy]
python_version = "3.12"
# ADR-0023: strict on new code; ported code is typed when touched.
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# package = false above means `app` is not installed; put backend/ on sys.path.
pythonpath = ["."]
markers = ["integration: needs a real Postgres (RLS cannot be tested on SQLite)"]
