[project]
name = "obliance-backend"
version = "0.1.0"
description = "Obliance — backend (FastAPI, SQLAlchemy 2, Postgres RLS). See docs/adr/0023."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "redis>=5.0,<6",
    "rq>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"migrations/**" = ["ANN", "E501"]

[tool.mypy]
python_version = "3.12"
# ADR-0023: strict on new code; ported code is typed when touched.
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# package = false above means `app` is not installed; put backend/ on sys.path.
pythonpath = ["."]
markers = ["integration: needs a real Postgres (RLS cannot be tested on SQLite)"]
